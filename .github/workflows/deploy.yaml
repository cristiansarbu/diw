name: Deploy to GitHub Pages

on:
  # Runs on pushes to the "master" branch
  push:
    branches: [ "master" ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets the permissions the GITHUB_TOKEN needs to deploy to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 💡 CAMBIO CRUCIAL: Subimos el contenido de la carpeta 'hotel-logrono'
          # Esto hace que el contenido se sirva desde la raíz de GitHub Pages.
          path: './hotel-logrono' 
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
